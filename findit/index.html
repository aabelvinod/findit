<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FindIt — Smart Lost &amp; Found for Schools</title>
    <meta name="description" content="FindIt helps students and teachers report lost belongings, browse found items, and discover safe possible matches." />
    <meta name="theme-color" content="#3d5bff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070b18" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233d5bff'/%3E%3Cstop offset='.55' stop-color='%237b5cf6'/%3E%3Cstop offset='1' stop-color='%230bb3d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='white' stroke-width='3' opacity='.9'/%3E%3Cpath d='M40 24 27 29l-3 11 13-5z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Painted before the bundle loads so the first frame is never white. */
      html { background: #eef1fb; }
      html.dark { background: #070b18; }
    </style>
    <script>
      // Applies the saved theme before first paint so dark mode never flashes white.
      try {
        var saved = localStorage.getItem("findit_theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
